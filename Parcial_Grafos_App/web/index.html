<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcial de Grafos · TSP, m-TSP, caminos y árboles</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="barra glass entra">
  <div class="marca">
    <div class="logo"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="19" cy="15" r="2"/><path d="M6.5 16.5 10.8 7.7M13.8 7.2l4 6.4M7 18h10"/></svg></div>
    <div><b>Parcial de Grafos</b><small>Optimización exacta de rutas y redes</small></div>
  </div>
  <nav class="segmentado" id="tabs" role="tablist" aria-label="Proyecto"><span class="ind"></span></nav>
  <button class="btn gris" id="bProyecto" aria-label="Menú del proyecto" title="Proyecto"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="lbl">Proyecto</span></button>
  <div class="acciones">
    <span class="pill" id="pMotor"><i></i><span>Iniciando solver…</span></span>
    <button class="btn sec" id="bImportar"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg><span class="lbl">Importar</span></button>
    <button class="btn sec" id="bExportar"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0 4 4m-4-4-4 4M5 21h14"/></svg><span class="lbl">Exportar</span></button>
    <button class="btn gris" id="bTema" title="Cambiar tema" aria-label="Cambiar tema"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
  </div>
</header>

<main class="app">
  <aside class="col izq">
    <section class="tarjeta glass entra" style="--i:1" id="cBusca"></section>
    <section class="tarjeta glass entra" style="--i:2" id="cHerr"></section>
    <section class="tarjeta glass entra" style="--i:3" id="cProblema"></section>
    <section class="tarjeta glass entra" style="--i:4" id="cParcial"></section>
  </aside>

  <section class="tarjeta glass mapa-wrap entra" style="--i:2">
    <div id="mapa" aria-label="Mapa"></div>
    <div class="mapa-ctl arr-izq"><span class="chip" id="chipMapa">Cargando mapa…</span></div>
    <div class="mapa-ctl abj-izq"><button class="btn gris mini" id="bAjustar">Ajustar vista</button></div>
    <div class="leyenda glass oculto" id="leyenda"></div>
  </section>

  <aside class="col der">
    <section class="tarjeta glass panel-der entra" style="--i:3">
      <div id="stats" class="stats"></div>
      <nav class="segmentado peq" id="tabsDer" role="tablist"><span class="ind"></span></nav>
      <div class="contenido" id="contenido"></div>
    </section>
  </aside>
</main>

<div class="menu glass" id="menuExp" role="menu"></div>
<div class="velo" id="velo"><div class="hoja glass" id="hoja" role="dialog" aria-modal="true"></div></div>
<input type="file" id="archivo" class="oculto" accept=".csv,.tsv,.txt,.xlsx,.json">

<script src="vendor/leaflet.js"></script>
<script src="js/solver.js"></script>
<script src="js/datos.js"></script>
<script src="js/mapa.js"></script>
<script src="js/app.js"></script>
<script src="js/edicion.js"></script>
<script src="js/capas.js"></script>
<script src="js/ubicacion.js"></script>
<script src="js/proyectos.js"></script>
<script>App.arrancar();</script>
</body>
</html>
